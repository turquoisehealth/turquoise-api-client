name: Publish SDKs

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

jobs:
  prepare:
    name: Determine version and release type
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_type.outputs.version }}
      release_type: ${{ steps.release_type.outputs.type }}
      npm_tag: ${{ steps.release_type.outputs.npm_tag }}
    steps:
      - name: Determine release type
        id: release_type
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "type=production" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Strip 'v' prefix
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "type=dev" >> $GITHUB_OUTPUT
            echo "npm_tag=dev" >> $GITHUB_OUTPUT
            SHORT_SHA="${{ github.sha }}"
            SHORT_SHA="${SHORT_SHA:0:7}"
            DEV_VERSION="0.0.0-dev.${SHORT_SHA}"
            echo "version=$DEV_VERSION" >> $GITHUB_OUTPUT
          fi

  publish-python:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stamp package version
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ needs.prepare.outputs.version }}\"/" python/pyproject.toml

      - name: Publish to PyPI (production)
        if: env.TWINE_PASSWORD != '' && needs.prepare.outputs.release_type == 'production'
        working-directory: python
        run: |
          pip install build twine
          python -m build
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Publish to TestPyPI (dev)
        if: env.TWINE_PASSWORD != '' && needs.prepare.outputs.release_type == 'dev'
        working-directory: python
        run: |
          pip install build twine
          python -m build
          twine upload --repository testpypi dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_TOKEN }}

  publish-typescript:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Stamp package version
        run: |
          npm --prefix typescript version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm (production)
        if: env.NODE_AUTH_TOKEN != '' && needs.prepare.outputs.release_type == 'production'
        working-directory: typescript
        run: |
          npm ci
          npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (dev)
        if: env.NODE_AUTH_TOKEN != '' && needs.prepare.outputs.release_type == 'dev'
        working-directory: typescript
        run: |
          npm ci
          npm publish --access public --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-csharp:
    name: Publish C# SDK
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      id-token: write  # Required for NuGet OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Pack NuGet package
        working-directory: csharp
        run: |
          dotnet pack --configuration Release -p:Version=${{ needs.prepare.outputs.version }}

      - name: Publish to NuGet with API key
        if: env.NUGET_API_KEY != ''
        working-directory: csharp
        run: |
          dotnet nuget push **/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: NuGet login (OIDC)
        if: env.NUGET_API_KEY == ''
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: devops-turquoise

      - name: Publish to NuGet with OIDC
        if: env.NUGET_API_KEY == ''
        working-directory: csharp
        run: |
          dotnet nuget push **/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
