name: Publish SDKs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Production version to publish (for example, 3.2.68)"
        required: true
        type: string
      sdk:
        description: "SDK to publish"
        required: true
        type: choice
        options:
          - all
          - python
          - typescript
          - csharp
        default: all

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish_python: ${{ steps.sdk.outputs.publish_python }}
      publish_typescript: ${{ steps.sdk.outputs.publish_typescript }}
      publish_csharp: ${{ steps.sdk.outputs.publish_csharp }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Validate version
        id: release
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          [[ "$GITHUB_REF" == refs/tags/v* ]] || {
            echo "Publishing must be run against a v* release tag."
            exit 1
          }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must use production semver, for example 3.2.68."
            exit 1
          }
          [[ "$TAG_VERSION" == "$VERSION" ]] || {
            echo "Workflow version $VERSION does not match tag version $TAG_VERSION."
            exit 1
          }

          OPENAPI_VERSION=$(jq -r '.info.version' openapi.json)
          PYTHON_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' python/pyproject.toml)
          NPM_VERSION=$(jq -r '.version' typescript/package.json)
          LOCK_VERSION=$(jq -r '.packages[""].version' typescript/package-lock.json)

          [[ "$OPENAPI_VERSION" == "$VERSION" ]] || { echo "openapi.json is $OPENAPI_VERSION"; exit 1; }
          [[ "$PYTHON_VERSION" == "$VERSION" ]] || { echo "pyproject.toml is $PYTHON_VERSION"; exit 1; }
          [[ "$NPM_VERSION" == "$VERSION" ]] || { echo "package.json is $NPM_VERSION"; exit 1; }
          [[ "$LOCK_VERSION" == "$VERSION" ]] || { echo "package-lock.json is $LOCK_VERSION"; exit 1; }

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Select SDKs
        id: sdk
        run: |
          for sdk in python typescript csharp; do
            if [[ "${{ inputs.sdk }}" == "all" || "${{ inputs.sdk }}" == "$sdk" ]]; then
              echo "publish_${sdk}=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish_${sdk}=false" >> "$GITHUB_OUTPUT"
            fi
          done

  publish-python:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.publish_python == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          pip install build
          python -m build python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true

  publish-typescript:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.publish_typescript == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      - name: Publish to npm
        working-directory: typescript
        run: npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-csharp:
    name: Publish C# SDK
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.publish_csharp == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Pack NuGet package
        working-directory: csharp
        run: dotnet pack --configuration Release -p:Version=${{ needs.prepare.outputs.version }}

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: devops-turquoise

      - name: Publish to NuGet with OIDC
        working-directory: csharp
        run: |
          dotnet nuget push **/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
