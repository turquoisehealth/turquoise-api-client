name: Publish SDKs

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Publish SDKs to registries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release type
        id: release_type
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "type=production" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Strip 'v' prefix
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "type=dev" >> $GITHUB_OUTPUT
            echo "npm_tag=dev" >> $GITHUB_OUTPUT
            SHORT_SHA="${{ github.sha }}"
            SHORT_SHA="${SHORT_SHA:0:7}"
            DEV_VERSION="0.0.0-dev.${SHORT_SHA}"
            echo "version=$DEV_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install Fern CLI
        run: npm install -g fern-api

      - name: Regenerate SDKs at this tag
        run: fern generate
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

      - name: Update library exports
        run: python3 scripts/update_lib_exports.py

      - name: Stamp package versions
        run: |
          VERSION="${{ steps.release_type.outputs.version }}"
          npm --prefix typescript version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" python/pyproject.toml

      - name: Publish Python SDK to PyPI (production)
        if: env.TWINE_PASSWORD != '' && steps.release_type.outputs.type == 'production'
        working-directory: python
        run: |
          pip install build twine
          python -m build
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Publish Python SDK to TestPyPI (dev)
        if: env.TWINE_PASSWORD != '' && steps.release_type.outputs.type == 'dev'
        working-directory: python
        run: |
          pip install build twine
          python -m build
          twine upload --repository testpypi dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_TOKEN }}

      - name: Publish TypeScript SDK to npm (production)
        if: env.NODE_AUTH_TOKEN != '' && steps.release_type.outputs.type == 'production'
        working-directory: typescript
        run: |
          npm ci
          npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish TypeScript SDK to npm (dev)
        if: env.NODE_AUTH_TOKEN != '' && steps.release_type.outputs.type == 'dev'
        working-directory: typescript
        run: |
          npm ci
          npm publish --access public --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish C# SDK to NuGet (production)
        if: env.NUGET_API_KEY != '' && steps.release_type.outputs.type == 'production'
        working-directory: csharp
        run: |
          dotnet build --configuration Release
          dotnet nuget push **/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Publish C# SDK to NuGet (dev)
        if: env.NUGET_API_KEY != '' && steps.release_type.outputs.type == 'dev'
        working-directory: csharp
        run: |
          dotnet build --configuration Release
          dotnet nuget push **/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
