name: Publish SDKs

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 3.2.55 or 0.0.0-dev.abc123)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - production
          - dev
        default: production
      sdk:
        description: 'SDK to publish'
        required: true
        type: choice
        options:
          - all
          - python
          - typescript
          - csharp
        default: all

jobs:
  prepare:
    name: Determine version and release type
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_type.outputs.version }}
      python_version: ${{ steps.release_type.outputs.python_version }}
      npm_version: ${{ steps.release_type.outputs.npm_version }}
      release_type: ${{ steps.release_type.outputs.type }}
      npm_tag: ${{ steps.release_type.outputs.npm_tag }}
      publish_python: ${{ steps.release_type.outputs.publish_python }}
      publish_typescript: ${{ steps.release_type.outputs.publish_typescript }}
      publish_csharp: ${{ steps.release_type.outputs.publish_csharp }}
    steps:
      - name: Determine release type
        id: release_type
        run: |
          # Handle workflow_dispatch (manual trigger)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT

            # Set language-specific versions
            # For production releases, all use the same version
            # For dev releases with git SHA, format differs by language
            if [[ "$VERSION" =~ ^0\.0\.0-dev\. ]]; then
              # Convert npm format (0.0.0-dev.abc123) to Python format (0.0.0.dev0+abc123)
              PYTHON_VERSION="${VERSION//-dev./.dev0+}"
              echo "python_version=$PYTHON_VERSION" >> $GITHUB_OUTPUT
              echo "npm_version=$VERSION" >> $GITHUB_OUTPUT
            else
              echo "python_version=$VERSION" >> $GITHUB_OUTPUT
              echo "npm_version=$VERSION" >> $GITHUB_OUTPUT
            fi

            echo "type=${{ inputs.release_type }}" >> $GITHUB_OUTPUT

            if [[ "${{ inputs.release_type }}" == "production" ]]; then
              echo "npm_tag=latest" >> $GITHUB_OUTPUT
            else
              echo "npm_tag=dev" >> $GITHUB_OUTPUT
            fi

            # Determine which SDKs to publish
            if [[ "${{ inputs.sdk }}" == "all" || "${{ inputs.sdk }}" == "python" ]]; then
              echo "publish_python=true" >> $GITHUB_OUTPUT
            else
              echo "publish_python=false" >> $GITHUB_OUTPUT
            fi

            if [[ "${{ inputs.sdk }}" == "all" || "${{ inputs.sdk }}" == "typescript" ]]; then
              echo "publish_typescript=true" >> $GITHUB_OUTPUT
            else
              echo "publish_typescript=false" >> $GITHUB_OUTPUT
            fi

            if [[ "${{ inputs.sdk }}" == "all" || "${{ inputs.sdk }}" == "csharp" ]]; then
              echo "publish_csharp=true" >> $GITHUB_OUTPUT
            else
              echo "publish_csharp=false" >> $GITHUB_OUTPUT
            fi
          # Handle tag push (automatic production release)
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "type=production" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Strip 'v' prefix
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "python_version=$VERSION" >> $GITHUB_OUTPUT
            echo "npm_version=$VERSION" >> $GITHUB_OUTPUT
            echo "publish_python=true" >> $GITHUB_OUTPUT
            echo "publish_typescript=true" >> $GITHUB_OUTPUT
            echo "publish_csharp=true" >> $GITHUB_OUTPUT
          # Handle branch push (automatic dev release)
          else
            echo "type=dev" >> $GITHUB_OUTPUT
            echo "npm_tag=dev" >> $GITHUB_OUTPUT
            SHORT_SHA="${{ github.sha }}"
            SHORT_SHA="${SHORT_SHA:0:7}"
            # Python uses PEP 440 format: 0.0.0.dev0+abc123
            PYTHON_VERSION="0.0.0.dev0+${SHORT_SHA}"
            # npm uses semver format: 0.0.0-dev.abc123
            NPM_VERSION="0.0.0-dev.${SHORT_SHA}"
            echo "version=$NPM_VERSION" >> $GITHUB_OUTPUT
            echo "python_version=$PYTHON_VERSION" >> $GITHUB_OUTPUT
            echo "npm_version=$NPM_VERSION" >> $GITHUB_OUTPUT
            echo "publish_python=true" >> $GITHUB_OUTPUT
            echo "publish_typescript=true" >> $GITHUB_OUTPUT
            echo "publish_csharp=true" >> $GITHUB_OUTPUT
          fi

  publish-python:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.publish_python == 'true'
    permissions:
      contents: read
      id-token: write  # Required for PyPI OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stamp package version
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ needs.prepare.outputs.python_version }}\"/" python/pyproject.toml

      - name: Build package
        run: |
          pip install build
          python -m build python

      - name: Publish to PyPI (production)
        if: needs.prepare.outputs.release_type == 'production'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true

      - name: Publish to TestPyPI (dev)
        if: needs.prepare.outputs.release_type == 'dev'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: python/dist/
          skip-existing: true

  publish-typescript:
    name: Publish TypeScript SDK
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.publish_typescript == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Stamp package version
        run: |
          npm --prefix typescript version "${{ needs.prepare.outputs.npm_version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm (production)
        if: env.NODE_AUTH_TOKEN != '' && needs.prepare.outputs.release_type == 'production'
        working-directory: typescript
        run: |
          npm ci
          npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (dev)
        if: env.NODE_AUTH_TOKEN != '' && needs.prepare.outputs.release_type == 'dev'
        working-directory: typescript
        run: |
          npm ci
          npm publish --access public --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-csharp:
    name: Publish C# SDK
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.publish_csharp == 'true'
    permissions:
      contents: read
      id-token: write  # Required for NuGet OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Copy README for NuGet package
        run: |
          cp README.md csharp/README.md

      - name: Pack NuGet package
        working-directory: csharp
        run: |
          dotnet pack --configuration Release -p:Version=${{ needs.prepare.outputs.version }}

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: devops-turquoise

      - name: Publish to NuGet with OIDC
        working-directory: csharp
        run: |
          dotnet nuget push **/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
