name: Regenerate SDKs

on:
  workflow_dispatch:
    inputs:
      openapi_url:
        description: "URL to fetch openapi.json from"
        required: false
        default: "https://turquoise.health/api/docs/openapi.json"
      api_version:
        description: "API version to stamp into packages (e.g. v3.2.0)"
        required: false

jobs:
  regenerate:
    name: Regenerate SDKs from OpenAPI spec
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          RAW="${{ inputs.api_version || 'dev' }}"
          # Strip leading 'v' for package managers (v3.2.0 → 3.2.0)
          SEMVER="${RAW#v}"
          echo "raw=$RAW" >> $GITHUB_OUTPUT
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT

      - name: Update openapi.json from URL
        run: curl -fsSL "${{ inputs.openapi_url }}" -o openapi.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Fern CLI
        run: npm install -g fern-api

      - name: Generate SDKs
        run: fern generate
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

      - name: Update library exports
        run: python3 scripts/update_lib_exports.py

      - name: Open PR with updated SDKs
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sdk-${{ steps.version.outputs.raw }}
          commit-message: "chore: regenerate SDKs for ${{ steps.version.outputs.raw }}"
          title: "chore: regenerate SDKs for ${{ steps.version.outputs.raw }}"
          body: |
            Manual SDK regeneration for version **${{ steps.version.outputs.raw }}**.

            Changes:
            - `openapi.json` updated from `${{ inputs.openapi_url }}`
            - All three SDKs regenerated via Fern

            Review the diff to confirm the SDK changes are correct, then merge to trigger publishing.
          labels: automated
