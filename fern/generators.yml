api:
  specs:
    - openapi: ../openapi.json

default-group: local

groups:
  local:
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.46.3
        output:
          location: local-file-system
          path: ../python
        config:
          package_name: turquoise-health
          client_class_name: TurquoiseHealth

      - name: fernapi/fern-typescript-node-sdk
        version: 3.34.3
        output:
          location: local-file-system
          path: ../typescript
        config:
          packageName: "@turquoise-health/api"

      - name: fernapi/fern-csharp-sdk
        version: 2.11.4
        output:
          location: local-file-system
          path: ../csharp
        config:
          namespace: TurquoiseHealth.Api
          packageName: TurquoiseHealth.Api
