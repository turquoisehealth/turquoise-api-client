[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turquoisehealth-api"
version = "3.2.114"
description = "Official Python client for the Turquoise Health Consumer Pricing API"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
  "httpx>=0.21.2",
  "pydantic>=1.9.2",
  "typing_extensions>=4.0.0",
]

[project.urls]
Repository = "https://github.com/turquoisehealth/turquoise-api-client"

[tool.hatch.build.targets.wheel]
only-include = [
  "__init__.py",
  "client.py",
  "environment.py",
  "consumer_pricing",
  "core",
  "errors",
  "lib",
  "types",
]
exclude = [
  "tests",
  ".fern",
  ".fernignore",
  ".gitignore",
  "pyproject.toml",
]

[tool.hatch.build.targets.wheel.sources]
"" = "turquoise_health"
